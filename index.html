    <main class="container">
      <section class="start-screen" id="start-screen">
        <h2 class="start-screen__heading">تحدي خمن الكلمة</h2>
        <p class="start-screen__sub-title">
          اختر التصنيف ثم انطلق لتخمين الكلمة قبل اكتمال المشنقة!
        </p>
        <div class="category-list"></div>
        <button class="start-game">
          أبدأ التخمين
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
            <path
              d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"
            />
          </svg>
        </button>
      </section>
      <section class="game-section" hidden>
        <dl class="game-info">
          <div class="category">
            <dt>التصنيف:</dt>
            <dd></dd>
          </div>
          <div class="attempts-tracker">
            <dt class="attempts-label">المحاولات:</dt>
            <dd class="attempts-count" dir="ltr">
              <span class="current-attempts"></span><span>/</span
              ><span class="max-attempts"></span>
            </dd>
            <svg class="heart-icon"><use href="#heart-icon"></use></svg>
          </div>
        </dl>
        <hr />
        <div class="row">
          <div class="hangman-draw">
            <div class="the-draw part">
              <div class="the-stand part"></div>
              <div class="the-hang part"></div>
              <div class="the-rope part"></div>
              <div class="the-man">
                <div class="head part"></div>
                <div class="body part"></div>
                <div class="hands part"></div>
                <div class="legs part"></div>
              </div>
            </div>
          </div>
          <div class="letters"></div>
        </div>
        <hr />
        <div
          class="letters-guess"
          role="group"
          aria-label="الحروف المخمنة"
          aria-live="polite"
        ></div>
      </section>
      <dialog class="result-modal" aria-labelledby="result-title">
        <h2 class="result-modal__title" id="result-title"></h2>
        <p class="result-modal__sub-title">الكلمة هي:</p>
        <div class="result-modal__word-wrapper">
          <p class="result-modal__label">الكلمة المستهدفة</p>
          <p class="result-modal__word"></p>
          <p class="result-modal__description"></p>
        </div>
        <p class="result-modal__stats" hidden></p>
        <button class="result-modal__again-btn">العب مجددا</button>
        <button class="result-modal__home-btn">القائمة الرئيسية</button>
      </dialog>
      <dialog class="dialog_hint">قم بتغيير اللغة من لوحة المفاتيح</dialog>
    </main>
    <script src="main.js" type="module"></script>
  </body>
